  - opencv>=4.8.0
  - streamlit>=1.28.0
  - scikit-learn>=1.3.0
  - pandas>=1.5.0
  - pillow>=9.0.0
  - pytest>=7.0.0
  - pip:
    - mpi4py>=3.1.4
